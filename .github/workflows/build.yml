name: Build

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="0.0.0"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build
        run: >
          dotnet build Emby.Plugin.WeTrakr/Emby.Plugin.WeTrakr.csproj -c Release
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version }}.0
          -p:FileVersion=${{ steps.version.outputs.version }}.0

      - name: Package
        run: |
          mkdir -p artifacts
          cp Emby.Plugin.WeTrakr/bin/Release/netstandard2.0/Emby.Plugin.WeTrakr.dll artifacts/
          cd artifacts && sha256sum Emby.Plugin.WeTrakr.dll > Emby.Plugin.WeTrakr.dll.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Emby.Plugin.WeTrakr
          path: artifacts/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Emby.Plugin.WeTrakr.dll
            artifacts/Emby.Plugin.WeTrakr.dll.sha256
          generate_release_notes: true
